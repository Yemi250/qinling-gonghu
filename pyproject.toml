[project]
name = "qinling-gonghu"
version = "0.1.0"
description = "秦岭共护业务后端与公共契约"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "python-multipart>=0.0.20,<1",
  "pillow>=11,<13",
  "pydantic-settings>=2.8,<3",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "httpx2>=2.13.1",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
