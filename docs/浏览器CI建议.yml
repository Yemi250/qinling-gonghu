name: Contract and lifecycle checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked
      - run: uv run ruff check backend scripts
      - run: uv run pytest backend/tests backend/tests_ai -q
      - run: npm --prefix frontend ci
      - run: uv run python -m scripts.export_openapi
      - run: npm --prefix frontend run generate:types
      - run: git diff --exit-code -- docs/openapi.json frontend/src/api/schema.d.ts
      - run: npm --prefix frontend run build
      - run: npx --prefix frontend playwright install --with-deps chromium
      - run: npm --prefix frontend run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: data/browser-evidence/
      - run: uv run python -m scripts.smoke
